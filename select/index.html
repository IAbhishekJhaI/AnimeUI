<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Select</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 80px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: center; gap: 24px; min-height: 280px; padding: 60px 0 40px; }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Select</h1>
  <p class="sub">A dropdown that snaps open on a spring and locks in your pick with a slash and カチッ.</p>
  <div class="stage">
    <sakuga-select id="el" label="Animation timing">
      <option value="ones" selected>On ones (24 fps)</option>
      <option value="twos">On twos (12 fps)</option>
      <option value="impact">Impact cut</option>
      <option value="smear">Smear frame</option>
    </sakuga-select>
  </div>
  <p class="hint">Click to open, pick an option, or use Arrow keys, Enter and Escape.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="select.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
el.addEventListener('change', () => { document.querySelector('.said').textContent = `change: ${el.value}`; });
</script>
</body>
</html>
