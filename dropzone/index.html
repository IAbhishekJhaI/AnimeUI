<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakuga Dropzone</title>
<style>
  :root { --page: #ffffff; --text: #1d1a4a; --mute: #8580b0; }
  html { overflow-x: clip; background: var(--page); }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--page); color: var(--text); font: 15px/1.45 -apple-system, "Helvetica Neue", "Segoe UI", sans-serif; overflow-x: clip; }
  main { width: min(640px, 100vw - 32px); padding: 40px 0 80px; }
  h1 { margin: 0; font: italic 800 26px/1.1 "Avenir Next", "Nunito", -apple-system, "Segoe UI", sans-serif; }
  .sub { margin: 4px 0 0; color: var(--mute); }
  .stage { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; min-height: 270px; padding: 60px 0 30px; }
  .demo { padding: 7px 14px; border: 1.5px solid #dcdaf0; border-radius: 999px; background: none; color: var(--text); font: 600 13px/1.2 inherit; cursor: pointer; }
  .demo:hover { border-color: var(--text); }
  .hint, .said { margin: 0 4px; color: var(--mute); } .said { min-height: 1.45em; margin-top: 8px; font-size: 13px; }
  .embed body { place-items: start center; min-height: 0; } .embed h1, .embed .sub, .embed .hint { display: none; } .embed main { padding: 0; }
</style>
</head>
<body>
<main>
  <h1>Dropzone</h1>
  <p class="sub">A file drop target that stretches with ゴゴゴゴ on drag-over and catches drops with a splash crown and ズザッ.</p>
  <div class="stage">
    <sakuga-dropzone id="el" label="Drop keyframes here" hint="PNG, WebP or click to browse"></sakuga-dropzone>
    <button class="demo" type="button" id="sim">Simulate file drop</button>
  </div>
  <p class="hint">Drag a file over the box, click to browse, or press Simulate file drop.</p>
  <p class="said" aria-live="polite"></p>
</main>
<script src="dropzone.js"></script>
<script>
const Q = new URLSearchParams(location.search), el = document.getElementById('el'), said = document.querySelector('.said');
if (Q.get('embed') === '1') document.documentElement.classList.add('embed');
el.addEventListener('change', () => {
  const names = el.files.map((f) => (typeof f === 'string' ? f : f.name));
  said.textContent = names.length ? `files: ${names.join(', ')}` : 'cleared';
});
document.getElementById('sim').addEventListener('click', () => el.receive(['cut-04-impact.webp']));
</script>
</body>
</html>
